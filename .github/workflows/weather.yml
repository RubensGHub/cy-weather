name: CI - Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install test dependencies
      working-directory: ./api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
    
    - name: Run tests
      working-directory: ./api
      run: |
        pytest tests/ -v --cov=src --cov-report=term
    
    - name: Build Docker images
      run: |
        docker compose build
    
    - name: Start services
      run: |
        docker compose up -d
        sleep 15
    
    - name: Health check API
      run: |
        python -c "import httpx; r = httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code == 200 else 1)"
    
    - name: Health check Web
      run: |
        python -c "import httpx; r = httpx.get('http://localhost:5173'); exit(0 if r.status_code == 200 else 1)"
    
    - name: Show logs on failure
      if: failure()
      run: |
        docker compose logs
    
    - name: Stop services
      if: always()
      run: |
        docker compose down -v
